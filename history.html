<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var t = localStorage.getItem("codepulse_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodePulse | History</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/history.css" />
</head>
<body class="has-bottom-nav">
  <header class="header">
    <div class="logo">
      <span class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 12 8 12 10.5 6 14 18 16.5 12 21 12" />
        </svg>
      </span>
      CodePulse
    </div>
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
       <a href="progress.html">Progress</a>
      <a href="history.html" class="active">History</a>
      <a href="settings.html" class="settings-link" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <main class="page history-page">
    <h1>History</h1>
    <p class="lead">Your coding journey, one session at a time.</p>

    <section class="progress-card">
      <div class="progress-card-head">
        <span>Your Progress</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <div class="progress-stats">
        <div class="progress-stat">
          <strong id="hist-sessions">0</strong>
          <span>Sessions</span>
        </div>
        <div class="progress-divider"></div>
        <div class="progress-stat">
          <strong id="hist-total">0m</strong>
          <span>Total</span>
        </div>
      </div>
      <p class="progress-note" id="progress-note">Keep building your streak!</p>
    </section>

    <div class="sessions-head">
      <h2>Your sessions</h2>
      <span class="muted-label">Recent activity</span>
    </div>

    <div class="filter-chips" id="filter-chips">
      <button class="filter-chip active" data-filter="All">All</button>
      <button class="filter-chip" data-filter="Learned">Learned</button>
      <button class="filter-chip" data-filter="Built">Built</button>
      <button class="filter-chip" data-filter="Debugged">Debugged</button>
      <button class="filter-chip" data-filter="Practiced">Practiced</button>
      <button class="filter-chip" data-filter="Revised">Revised</button>
    </div>

    <div id="history-list"></div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>
      <span>Home</span>
    </a>
    <a href="progress.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      <span>Progress</span>
    </a>
    <a href="session.html">
      <span class="bottom-nav-plus-wrap"><span class="bottom-nav-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span></span>
      <span>Log</span>
    </a>
    <a href="history.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      <span>History</span>
    </a>
  </nav>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
