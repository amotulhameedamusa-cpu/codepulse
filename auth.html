<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var t = localStorage.getItem("codepulse_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodePulse - Sign in</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <a href="index.html" class="auth-logo">
      <span class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 12 8 12 10.5 6 14 18 16.5 12 21 12" />
        </svg>
      </span>
      CodePulse
    </a>

    <form class="card auth-card" id="auth-form" novalidate>
      <h1 id="auth-title">Welcome back</h1>
      <p class="lead" id="auth-lead">Log in to continue your coding journey.</p>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" autocomplete="current-password" placeholder="At least 8 characters" />
        <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">Show</button>
      </div>

      <p class="auth-error" id="auth-error" role="alert"></p>

      <button type="submit" class="btn" id="auth-submit">Log in</button>

      <p class="auth-switch">
        <span id="switch-text">New here?</span>
        <a href="#" id="switch-link">Create an account</a>
      </p>
    </form>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
